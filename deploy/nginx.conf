# Example IP-only deployment. Replace 203.0.113.10 with your server IP/domain.
# Add TLS before enabling secure cookies.
server {
    listen 8080;
    server_name 203.0.113.10;
    # Keep this site's traffic separate. Create this log directory before reload.
    access_log /var/log/nginx/class-notice/access.log combined;
    error_log /var/log/nginx/class-notice.error.log warn;
    # App limit: 101 MiB, including multipart overhead for five 20 MiB files.
    client_max_body_size 102m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Word conversion runs locally with a bounded 35-second timeout.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_set_header Host $host;
        # One trusted Nginx proxy. Replace client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
